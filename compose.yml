services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5a1cc5f1843657f1b5798a57018f2baabfb3580b991b3b5785ebd131c5013039
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
