services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d87a4569761169847f90ca2ea8bed6764dbb38bbe0fecd0fdda03c8053693145
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
