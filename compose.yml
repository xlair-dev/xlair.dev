services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d892a1d5e782304dd0e79b03d630caab355cfd50f969e4192c589663575401e2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
