services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:42a2a9c09069062deb9ee22eeb04337f088ebb8f8d914944f40e3f59614683b2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
