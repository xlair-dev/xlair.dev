services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:51a561e8dff99c003811b0b862a133ba2b9ba708de71bf3d39168ed6dd67fcb6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
