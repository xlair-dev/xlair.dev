services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8eac70f4be2353428bdd433673a56a1d7ab470a15999015513524e4f86dcd1ca
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
