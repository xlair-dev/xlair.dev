services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7acfb0b8108c494c2ec0198030b93297884790e081bbdd76e44bf74b2a6325a2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
