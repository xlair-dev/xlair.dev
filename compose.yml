services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:802f1be503ead04ee9408283298bd09c353da59e59eddd6d631d988182c67873
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
