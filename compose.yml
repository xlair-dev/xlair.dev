services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:aff8c1ddf5a2c25fc7a9a60d542840f49a09169293a64709647212ca7394a3b2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
