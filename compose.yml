services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:cb3c153afe3bb60a1a45dbb43bbb450e33c51f78f20554756560e6a9a53e6b5b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
