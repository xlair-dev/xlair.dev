services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8a5835838ad4b5bea333cb9d8ca47ef40925b4041253d0d70f01e58b92f5b962
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
