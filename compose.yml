services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b0b5cc283b91af116fb0fe0985d1a59696dc9a8af9a541a7c6cb96cd07bc90dc
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
