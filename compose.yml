services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5541e04d8a7f85c58e3ac3e7ec2336a32bd9841185e26cc0fa9efd4b91827afb
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
