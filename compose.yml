services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3b8189bc2e2d7bce1f1a5942d7abeb7edaea1299a755bee4cbb52eb3de531af6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
