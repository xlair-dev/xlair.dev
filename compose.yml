services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:38d2238f660f4e0f3a36a4ef511e86f324a4824807f8fd73465ca65fed175dda
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
