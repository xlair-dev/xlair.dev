services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:705bf013293d518a485acd4afbc3b211f00d412a9b2e01372add08f1aa7c5033
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
