services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:943eef96bc0f5d285ec0d6f701bbb06a1243b05558fd7d63118c72b5a40b50ce
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
