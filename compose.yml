services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b2e39477d3496bc2887ad89fd8fb40585c2a8944e56deb80642561345d0bb586
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
