services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f8bdd37a5d524b9fcea773e59b7ee3be8a408cb94eb123c0389665bd8aefba00
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
