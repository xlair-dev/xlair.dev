services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:576e05fd176a59b24ca44eb4ded66ae8c58e764f22c7d8a0fa0bfa1d04f6e1f2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
