services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:6d3ca2a05664e6a99c40b3fd679f7b201a97553e3b3d0db58728dd5193e985d6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
