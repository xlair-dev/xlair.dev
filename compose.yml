services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7c7edb7bc2b5916899fb637328ad17f730170b1abdc37eae782edd63b7583877
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
