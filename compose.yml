services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:dad6173eb166289bd0be8953c5c883453f83643c474bb6ad34509cb74dadece7
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
