services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:25d9f626b265619fca4f3e119b3e29b0b65e505d36acafc69a1cc3d4571b82a1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
