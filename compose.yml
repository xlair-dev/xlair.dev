services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:52cdfff945e35f9b195c368432e931baf82f61c2c5564b0c21750837a061f3db
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
