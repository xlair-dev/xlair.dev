services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e7ff6ef77cf1dd4b6275728040cdfb721887637663002d9d0c7a85e6e7ea56e1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
