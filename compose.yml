services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f4f4985945f6f8bd7a5e0ee7c157807701e31e853f5e55be2478b1b12457364b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
