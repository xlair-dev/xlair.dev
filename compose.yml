services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1006a9fccf16c0afb0417441f3eeb2443fe02f676e24d0b3ba758abb123918e1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
