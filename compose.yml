services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ba5329bef421d7709f0a32b747abf6dcd70bc78c7ab48c566cb5644c2262e5fe
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
