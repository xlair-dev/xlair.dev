services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f2aee574e9739be8887fe38a706279cea6de237562f93d5e9e1a8e585c248a2e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
