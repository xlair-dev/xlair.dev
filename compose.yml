services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:501b43709b751853bdcefceeb36fa6eafd39e663a14058b3cec8db18095befb4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
