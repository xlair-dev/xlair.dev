services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4d793c35d56179933f20b95c53c3e4c8f4c13238e1865c43d9a9c69138adebd1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
