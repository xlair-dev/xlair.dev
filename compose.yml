services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4a662de9668453a6554151be29abb05402f780ca04ae745988384e04f7b78358
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
