services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d24f5e77cf98ce523f32fc8a0644085caa961e92c6c3ae0a4d09827bd6a1c3c4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
