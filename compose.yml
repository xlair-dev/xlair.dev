services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2cc682a0f20cfa347fa9f2fbef0c7aabaf2d75ceb5b12766e502ff577f3f98c5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
