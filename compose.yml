services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a2b9d5904a7f837175bfdf8dc3b09bfb08c7d968b51f8bc1ccaf5d8a0b4aa11c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
