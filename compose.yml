services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8b55168d0990e02eefa71eeaf5637b989673b214fdd9af8f998db4d8f9702d64
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
