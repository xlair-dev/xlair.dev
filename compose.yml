services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:01538d3f46217aa9d57d158655aa3a667c10ead768ff7c3cac0fba9f93a0a9f5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
