services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d4f7a3b7568b1f8d4e9b084f545962a27035f3d994a762f8623af53d78a0f31e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
