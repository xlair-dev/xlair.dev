services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e99e8082267fea5a0829f6e55cfd5e5f0c311a0b31e098e40ea7f0eef0d668b5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
