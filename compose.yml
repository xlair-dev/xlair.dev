services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a26098e4973a1d1d7a4184cd4be81b0b1fd255296ce0e73dd887b274d45e59a4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
