services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e97411377a15575fad476d459ce830b5ae02ceef694f7254dd68ce5263e4e035
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
