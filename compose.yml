services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:30875159794850b91f3b026919fece5d49cdb2d7e6d0636a823b4ff5a61e9ea6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
