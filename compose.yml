services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:af1cd54cf0f3563dcb2b2fdfa1a1a69b55dac9afcb7c7ed3795a44e3e1aa8b76
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
