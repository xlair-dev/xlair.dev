services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c61c266bba8baef348f06b7e749afdba4e5371054975aeb0cee631c4d20b7af5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
