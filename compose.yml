services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:932e29484815f6fc7bd9b936fb14695897ddf6833a277836c93798b73b422280
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
