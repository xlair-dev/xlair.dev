services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c7b4bff5a78a9310e9f6022ef7d7986680fe778fd6887eccf17dab603c9896c0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
