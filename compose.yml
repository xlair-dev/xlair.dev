services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:789649d0709c732c9742b94f74fab331ec96c2fe7d3d000bda55ea15cd85a70d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
