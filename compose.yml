services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b44be9afb44ad37ced312f6614b4a61081b8afc4fb7e40cc8f90321dc8f7ac13
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
