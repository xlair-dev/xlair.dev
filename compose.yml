services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b5c3ea68bced1b73f628f0799ab26479beca85ec781d576af32fce90cfe93a3b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
