services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:bc013cbcee6ecb9ef25bdc8ae9d15d9674fe5a6dd9e5cfc319b105c75f6d8ecc
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
