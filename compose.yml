services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1ad53470c8175b112b930b4c5eb27b3cbb018aff62ad1e5db35433d0b40263cd
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
