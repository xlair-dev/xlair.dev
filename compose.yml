services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:395c72679f2c9f934094e5138acba0550af4f4ad2fa27503e3fc6f2522ab9232
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
