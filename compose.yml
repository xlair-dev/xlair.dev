services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f09c8f975fdc6c36e50046b00a8cd0abae36783cd195df37df802bacd8b3cede
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
