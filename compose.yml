services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a3994c872bcb6640fe15578d2f4271eb8bfc56b5ce920b2e6349ba5c2ae72808
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
