services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:18841bffbf4e2bfdb0f2f48b2213673736eaf38de0f3a6e00773b04adc17b7ae
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
