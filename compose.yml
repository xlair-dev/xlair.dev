services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e4dadfac1beba8338e96e048dd34ed692db6c9b750bf3b4a8883167beb63c210
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
