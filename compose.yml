services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7237589e0b6b29cf6b3723ae9f7cb7c183011a716506e65ee553be3f974b5d31
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
