services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9f262a043b1e5c3172ec0a1b0d6b2ac6d8032e07c739d976ff85e15a64f2ca3e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
