services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7b6c4fecda150f9a930a4c60912449edc123e86352c0a30c887d998c9c456e8d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
