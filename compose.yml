services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c496dd236d06c260a1dc9404c603d0ae3fd1083b39a6ce47940c5280b6a5c495
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
