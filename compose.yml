services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b979addc25f20dc0f33f613a31ecedece8688a38384e5e00d91082d0149ee9c0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
