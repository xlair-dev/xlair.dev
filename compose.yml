services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:dc8ebe93bc680ae1aaf2bd5105d9c59fc9a63c118539ee765ac1c458cb205660
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
