services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:fa3e3214be00d129ba6a8ac473a947a53733e94030fac6bae3dd33a7ba20dbd9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
