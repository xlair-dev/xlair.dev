services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c89515b25bf6db190d17644c834a294b8a3f74e1200f8595b306a4f2f5ed7ceb
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
