services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:45407ac32ca4e0bb3d11f9061621d6055d0f79469243fc63e1db287425a6d765
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
