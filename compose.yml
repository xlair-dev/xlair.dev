services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8e2a2418b997211f8ca1d036dada5a385b72c5eac5b642753a52205a893d6ab2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
