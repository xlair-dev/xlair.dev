services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3e9689a4d10c989b34b8a99e61fa03526d44687fe8ea5452b0b5e8fadf2bacd4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
