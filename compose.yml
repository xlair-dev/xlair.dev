services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f159b26d533dd09830c0339ff50bf1f07d748af049e69a6a0076327a97827b55
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
