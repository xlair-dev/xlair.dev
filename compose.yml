services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d0b83944f369b3c4923cde73bd4f38593add086b43a76feb0943e661d60b769b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
