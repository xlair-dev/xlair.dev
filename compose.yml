services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:eb0acec5c37b0251b56092e3aa60db911c2f8bf19b42fbe063b9dbc5e3174c89
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
