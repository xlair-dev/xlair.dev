services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:54d3631bb926fdae353faee1d9ca8d7d919759360a25dfd8fdb79f5b913e298f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
