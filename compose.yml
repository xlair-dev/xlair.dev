services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:259c4cc6be040a473185acb672b3c4444d8812eaf176bc3965cef6042d5701aa
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
