services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0848c7f4c9186b695139f75c2d141b59a6676d851d7df02d3d5498bb82dd8235
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
