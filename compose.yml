services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:6f90a7ba1befa60d8e6fa9663b2efec37b83bb6c81d49c5b59c8dcbd1bcc2999
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
