services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e73cf7b294c1baadafd6de4e28c5948dfd9973cbad671e5f12ac43b940ddcd3e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
