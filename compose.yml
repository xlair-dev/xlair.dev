services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:62f3e57d34cbef77d242fba679c8380967f252f66dda18bd3a8c8017792061b9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
