services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:879ef5b8334fadd8d1f6c90c1c39da8c63f4509dbfa8c05c6f2e044a28b3f52f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
