services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:293cd2a1a0392657a0b47aefb362044455a0111ce8af07e1446dec228c219335
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
