services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:bb5ead73c38d8215a538d7acb0b1912d71575a2faffc857722097fb6c061406b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
