services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c00190a3d44a391bef9584c9fdf4491d72b4a106d9dc4fa0ca39aa11ec575b08
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
