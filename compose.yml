services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9a9e99a66d84dafb00381d94cc27c1e57d6d53e67a84e8ea8f420eaa38238f61
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
