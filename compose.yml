services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:94eb6a4e40573104855a10aabc7a29662276ba702882388cc8577ae2b41ba1e0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
