services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4ece4d2473432291b9d65908ac73e6fe1e28ab15950d8614d5eaecf3c0a52c0c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
