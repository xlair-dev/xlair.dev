services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d32bd218e7380f780662f5cab773897058acef9cd3ad64869f6bce58e898f561
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
