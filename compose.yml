services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2a1fe265fd992accf7df08163aaee2d60a8b17f72f9fe6e9c248e50f50fb6743
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
