services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:47f5db73a4cdf245440882e8ca4551384fc45dcb783308b5e392c948945b6afe
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
