services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:299eebbb9bae69885b5de3a2891c71d6881d0bc7e49501bd0c3012ff77f07613
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
