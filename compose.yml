services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:05a5e1c66928a387c74a3536e4168cd17a556a6266088191bb1e335472a9e8a0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
