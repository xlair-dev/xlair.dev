services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:df41b0b2640893000b28c4b343fe21c0bd50144878df2f5c7f575d234c17a40c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
