services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:216c8a9a8956470c8dc462fbc1732100718a8caa16f1a9a060d19310225b1af2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
