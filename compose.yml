services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:afe034dcb6c99dce58426de9305055c23e8995700189826535690e79e349a422
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
