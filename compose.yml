services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c6f355d547679c103918aedcfdc9baab2af4c55bb5cc11d7d2c39e51dae751c9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
