services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:310da08be8bf8f443dff6fac62cea26c2103d85949614ffc897974ae7912d496
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
