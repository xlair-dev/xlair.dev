services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:088b030098d6676a7fd660601e4cee0bcb716108b01e9a3054e9a8732535ec7c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
