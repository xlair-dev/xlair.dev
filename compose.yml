services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2ec8fa4ee83ba2a4d18839ceaa0c94d1a6cf0e50d211b4881ef1259775c7a884
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
