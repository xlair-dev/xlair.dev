services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4b54d8ab637b8412be7ce2386560c6766e820673b103556663f81af617dc705f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
