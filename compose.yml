services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7d2bf63147d2691e0c8bb0ad6c159d342daaecf5ebd772bb3235450258ef95b7
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
