services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9d15060e1c0526d123130aa02fe88b7f504175da698742777d6816b1cb3b8eae
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
