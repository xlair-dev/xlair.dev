services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ac1ba9281f8bac36153f21902cd1b76d44ff12625ab5fbb8b2efdcac6836ad05
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
