services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1999071e094777a5e24058d1c9bd67ca079cef4a952b4caa5c9a09a14f8c05c9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
