services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:97a73aa2e1e13aa00210f35ec0ce89d2641570c9c6c66096195e89fbad863c80
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
