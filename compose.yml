services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f709a635b9415b9b38c2504d33356a5b166368b6b435c8e8b9f23e0a381ae3c9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
