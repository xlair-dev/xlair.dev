services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7da06397f05765576ac993aec86a089c0a11b36c181161c16cff5e211fc3c547
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
