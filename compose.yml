services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:cddba274db807ad7b9ca36828092cc7ef2a6e4a4d0d76c7b8778b66764b437aa
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
