services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d8a652af988ac9b26c15bdc4d5fb766b5c6874b70f3d9c21fab26f8250847341
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
