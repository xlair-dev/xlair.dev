services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a2ce5fb4f74947206edae1c146f28298dcf5878e60c76722965668d8e5163f0b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
