services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8d9ee7c658631a99ee570dd4a2e32f8b438f67b42357e11bb41e0db63be6340e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
