services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4ef3a427321b720dec4c512d2b0d957d139813a9677eda3d9232117ce7ea0fa7
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
