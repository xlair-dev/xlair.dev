services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:763e2cb37843b569caad51e88ed4d540de5317670242b50cb2abef6b4b07bb2f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
