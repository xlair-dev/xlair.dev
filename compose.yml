services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:96c00ca6797d061f709e920b7fe195e1b333c057a208dc8d28fe56f676817cb1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
