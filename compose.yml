services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7be0e49124ebea7f66b18cd61c88069679720a35c49d277c6dd32f3c174f7b04
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
