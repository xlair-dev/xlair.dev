services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9ca30781a24dcb81b2fc5766948e0553ab0fd5459a82101030188b282ab2a617
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
