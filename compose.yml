services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:31b6c85f4ed718f4723a7d510992325d4e6eb006f93c3d3602b378bf798d312c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
