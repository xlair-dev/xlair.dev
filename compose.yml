services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:db6bdcd976d32fbce0ca6aec0a76fd61b376e7ed54e0157fef95143fc31d4bce
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
