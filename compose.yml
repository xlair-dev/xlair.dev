services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a924f09ceae3fa390b60807dda92ae4cc6ab66b0d801460e0201ef3329605b81
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
