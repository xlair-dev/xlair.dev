services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5426cefddf3dc2203482432e7cabb160c8687934bfa57fa630072d257dea3b31
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
