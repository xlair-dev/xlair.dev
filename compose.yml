services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3fe3a9a65d6e38b7a4361c2f9b1987c32ed99660f1830e22f648fbf1cc478d9c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
