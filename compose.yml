services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1a665d3e1938a238426172df0e7a45d85eeede726e63e779ea4b1a126bd1eb79
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
