services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ee321cba679cbb90c28bae9cca91bd69c25cd80cba31bb6b64f114a31786eb7f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
