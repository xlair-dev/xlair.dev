services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:55e7a4b3af6adfb0fbd919eabbf40b95c4f13480ade732c94df5e126585c390c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
