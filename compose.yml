services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:21575cebfe22a9d8669e1fbc7fb83e723dbe329571a6a68b23237dccdb81ecad
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
