services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c49aad9e5a8dba07b8568d8b0d66e634d7f995ec61f9e50bbae874e7155bcb60
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
