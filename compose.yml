services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f48571bdb6ee2cf6dd6a35520bb9a519e80376cc19ef1d38d7b488c41ab44248
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
