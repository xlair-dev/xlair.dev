services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1d27b2e2db41dc4affb4b9406ea37be5c1859b91724cae32085a441bdc5cd579
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
