services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5d02938490d360f489e850d29a8c4529ad4ab3dc73b5e8ed2e45ebb3f8416fe2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
