services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:461aaad817565fd7b39e3ad5d75cdf8303443e40b22e45ccbf25ff2a707d7c4d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
