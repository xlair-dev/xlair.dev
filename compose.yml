services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5ac557ee79294ef2594ab851d2db064160ee92669713888a140bb0027b2506ca
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
