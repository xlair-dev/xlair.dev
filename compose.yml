services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3d35da1d104bb92d4917f4d2fabf948961828911d662de2ff9eb789d146890ac
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
