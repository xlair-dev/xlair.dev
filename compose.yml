services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:72a97dc6b16318927e797cb2ca16ffed187318a7ef7f4eb389505b33c1bdc7fa
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
