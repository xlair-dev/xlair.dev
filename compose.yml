services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0d2ef2a7001b5aab505e351d91bd8a334529d28cd5f4abf4255e6d484a26c35b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
