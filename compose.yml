services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:14f27655df9e6600d539fe22aec12f6d847e5e6ad693f5493e14ad4bcd030f00
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
