services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2a13c47e7c79b30f1138d9ecd008f98f9b3bb1d4c2129ea983ee57b0d4f6f620
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
