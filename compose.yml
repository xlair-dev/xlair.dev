services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3a91ead443cc79b65029c91d8fa3cf9c2cc9a90b352f0b8de04043331099fb93
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
