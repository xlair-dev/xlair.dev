services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5fe4843b84a36bc27f798cf9236c3483d59436e0185867dd7f0f8bb0bd227e37
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
