services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:bd530f9e7522519231de3bc8dbd0672f7bac70718aef77ad4280442a0aafaa53
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
