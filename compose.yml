services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2110ae91092b6f0c9f45e3c72543c65495c3c8cf8dc4690b8644efbd2342d977
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
