services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:663168c9d5ac018754370cead9f3ca9759ee6c9b3be92b29431ae671bdb363a1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
