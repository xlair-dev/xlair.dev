services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7d7b51626423ff4645ea8289b9c95c9374f376efec016dcd1d8188e7dec602eb
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
