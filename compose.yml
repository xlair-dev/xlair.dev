services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7dbb9c9626d55ed7ce3469d6673560f23bcaac9d29603058f41378cc2890593f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
