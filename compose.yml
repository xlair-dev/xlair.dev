services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8181da2ac27b27041da575e3bffc6a51d403bb62d263d1be0ce07b5e7cdf35ba
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
