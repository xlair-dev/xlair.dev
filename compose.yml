services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d9d793789d65bf030a1999922eab18677e17f5347de6525096eed8c4e07cd9f4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
