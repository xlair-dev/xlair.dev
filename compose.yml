services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a729d5a0d7b23279df43426e3752ff55c78b3991a09d264758ffc95311bbdd3e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
