services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8afe6a33ea498b712df3671b28e07013e08734a98b91b610bae1ceb65bf8747b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
