services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1655a11cd083777bba03c0da92a6b25fe0f8fad3178446f177bfd59838ccbc6b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
