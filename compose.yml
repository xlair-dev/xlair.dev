services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ad57f6cb61439f85344766ca135d93958c691c866f5f1b47c6361b5ccb26377c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
