services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:57cb38385dd8dcf350c1e42f84c50f61b7342de27f01ac9700a251523f088af9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
