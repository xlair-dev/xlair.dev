services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0b2cb5dd7e8a16c1cae6e0cef30e53f11da6630bcfc7f68f9eb141a3493bb097
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
