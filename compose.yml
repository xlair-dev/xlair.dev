services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e445fcfde07569162c0c371cb6233915454031ca412ed62532d452073068dc68
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
