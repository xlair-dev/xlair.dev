services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9e5bc76293dd30a5585ab805d233100f638865908b3e0411a42d6c4895e210e9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
