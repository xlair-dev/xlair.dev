services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:636cd6da89c3154f82f7a0512578b99ea400f40901adcd4d77d7a58e75b9dab0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
