services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:57ecd8227edfb7bcd9d0ce7c34fe9ee8fd8d53be0bacbba180cd6c6c231248e2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
