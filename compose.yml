services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0c5d8d5023d40e0710d0da4fb58b9d4a81a576aeaffec3a96c8781d9f18a233b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
