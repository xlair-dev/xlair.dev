services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9a089e41e0c9c9606d83161affeea97b50c9a9001923bfddbae8d88359f0e79b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
