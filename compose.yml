services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:fed44b0b8c783dfe16b284a6543d71b182384b68a837d68efc2be8ba739bd9c9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
