services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e472aead54b34e8ad1e93139b61afbf9f70065a759ec66fbe4ed41cbf0d9a645
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
