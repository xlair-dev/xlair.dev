services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:96c44ebe7461fb1b619059b8293a8ebd9ec706055ee26d353fc78ee590424f64
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
