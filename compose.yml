services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a0415154ebd520c7c14d278cbe7fb9734df8c81c9113ffdc01cf3c02e6283ba9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
