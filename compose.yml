services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:71e2543febe04babb08c38156fb7b86888dc7838f78a6229f79d3cb32a6eb4c2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
