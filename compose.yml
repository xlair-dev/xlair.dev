services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b6e9172ee2bf06a78825d06da2b8bd29cec7f3eb91d41842bfb738a3310119b2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
