services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3d11e15d740d81c37069ef225494e029b1651e8bc5d7dcec4fa346571f53d92b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
