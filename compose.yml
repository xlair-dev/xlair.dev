services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f9dce5477acbc57233d919d18a57918f127bcc20d4d607682d693b165e0eecef
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
