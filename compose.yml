services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0d088e7d5ce299164378ee2e2692025a1a5bed86d7b53f1a2640447dc1ef3dc7
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
