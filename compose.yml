services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:eb1c4467bb1593e01b3c92b66bbda89f595d5b1377a1b64fd8ce30e55a129acb
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
