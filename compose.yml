services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7ccf7955b41a0dfa8755672ce004cb6ccb01c05174fcc1ec819f900c32ac4f99
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
