services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:977ec0711aecb4c7585db779f3da67116d661dcb6ddc092b6cf81017ef01ecc1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
