services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:daf0b20bad409efd964dfe9d32b25359dd0a98f180f4eef8a67360e1349d4e28
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
