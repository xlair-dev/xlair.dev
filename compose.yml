services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d1760844de70831f88f8a703f1b5cd0cd53938229f9463223fcc9940d691fcc5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
