services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:be03ad2460bc69f6d5c68d583b5a44d10af8f92407b2ac24ac309671e0332ab1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
