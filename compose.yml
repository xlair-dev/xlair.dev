services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ad74ecfc3c28e9b4e99ad88cafc4c0812485fc266645c36614927e427b2891e9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
