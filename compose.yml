services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e2fb12e78bae7829ca677024d8edfc6f319d3a4b6231c47aa09f07f99f412f3b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
