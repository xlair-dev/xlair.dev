services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3626653ee3dbb0d6ff43169d28108a010cb78ac2e67ed38bd208f2854185eb3c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
