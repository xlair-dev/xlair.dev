services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5b91ce3995bce6eb3e0ade3694ab3d76cf95779bcfcb4e9d587b876455b5a9c4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
