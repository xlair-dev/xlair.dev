services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a8e2d9bbb9e080cde9388946c5e2663f6922ac028f0be10c84805aebabcbcfb7
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
