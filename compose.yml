services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:688578b0743740cffde955ccb3f484d9a29c02ecfe3ca1345f78b805b162e75c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
