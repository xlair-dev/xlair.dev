services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e59596f8c98a2bc72ec7cb7b5a7ed14539233d544e13b31f7ab3f908e603e6e1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
