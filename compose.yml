services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5b69b65569506c4a3502a3d3f5707f6fa1d55a65bd2aa7889845cd13e9525c81
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
