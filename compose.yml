services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1fe337d70c811175a4cfca3314a8928dc5a4acf2f7f1d0040c3bc553fb9da876
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
