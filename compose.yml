services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:536b5a9f5a8c16ee28cfee42f5a2968e90b1e134d0bc9614bc365c8f9198ad1e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
