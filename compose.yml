services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e661324f0c26dc4191841fe4776f49975b2b15e1753a37f8a0e038215756e8c1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
