services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b16303d733dddca7dee5b9814be8326cd165ca22057e33bf3a8586a0372c7b82
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
