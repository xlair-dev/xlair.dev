services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:446d80a0bdb7fe25ef5574832b17d6dbb850fc85ee6742440f72a2a53e155c49
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
