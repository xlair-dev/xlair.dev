services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4ba9f81577fd3b27887d6bd3920abe46bfec2d46e84d03fa2fb8fa0323aa278a
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
