services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5196323962a57e860f103fd796b913e6ffdf76d7d5303eec033eef965a4ba968
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
