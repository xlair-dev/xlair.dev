services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0d56e948531d789c120c89d81169bd5569d806c36015580205fab0137377c461
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
