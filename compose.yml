services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:267bc50e9a2fb2a0aea6601efffa290e0fe161638843a44f782f6bdc8e30314a
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
