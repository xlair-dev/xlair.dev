services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:cdd0c96709a57bdf67b985c02592a5e7add5db90bc27b903a39ffbf4d50f3878
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
