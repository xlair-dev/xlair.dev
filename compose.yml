services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:b0299f2578aa23204cd715d690dbd7c10b97d05c067d53b9411f3ab0eb31fec6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
