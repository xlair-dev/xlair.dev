services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:632d0c1ccf0f191506f3159b787a1ea529fa8f6cd444587ec28f67d54a5fbcfd
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
