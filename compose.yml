services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ac0c5c29654713f3fde4ade67fa11e6c95e7e52d4cf0142d2ef8881942fff526
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
