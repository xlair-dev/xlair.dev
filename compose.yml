services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0a947ab350bcb443c22a08bff3f28d4faa967b901ab9ac68fb36cc4967c7502c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
