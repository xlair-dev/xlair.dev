services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9775aef643cb10e01c2c22a1af5a5c745b28646a74fb9bbd8c7d939d2b6d19c1
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
