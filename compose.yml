services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:00bb1931b2acf93e13ee474abd87f14eb467e3111a7e61331acbd6e9763f857d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
