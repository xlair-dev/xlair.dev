services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:71412e7b86deeeafbb5ac0ae608fa3e6be095bd7628c7484a00769c0ff039706
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
