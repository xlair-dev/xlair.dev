services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:caa788af7d33d732da434a49e989dcd0682da2d4c811cc96f6d379a2118ba9ed
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
