services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:339b7ac8dc735568021f23bfc92185a1f9169130ed1e1926579b2b94561ea962
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
