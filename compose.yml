services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:23e8aaf7b82a198ed53900ea1f96fd9edb794ab0ec6f605881d5a162cc6d7d1b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
