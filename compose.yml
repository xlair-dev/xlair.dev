services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4005202941ad90802214f54fca4c4aebfec7cdfc1758016ddaf9c9548eac1b57
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
