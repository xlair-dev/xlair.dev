services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:912df7298700471bfadec9894b19ac1324b3103ae386a3f6d699a4f1ad19d6ae
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
