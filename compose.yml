services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7ecd393d8786eba54c9dcba7cd6baccbc1ac9ce23e00d58f0e8d9c156e8b6368
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
