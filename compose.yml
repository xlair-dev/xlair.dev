services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ce7ab06537527e1ec23aedbf714589b487af2367432b803ee0bef992615a24c0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
