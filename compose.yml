services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:be6df59e2e41397b43f7b79f485f210ac39cf94fc51bea8838ca8a564d35c069
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
