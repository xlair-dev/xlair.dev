services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:44b815065b7479e8366c64d9e7b4bf7fdca82a96c66c64589532ea2f0700a688
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
