services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4e2760c81771b4fe9839d9fd2364b7d181d5d5fef125b3769a29ba47590e4275
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
