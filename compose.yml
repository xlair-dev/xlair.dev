services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d6c1eae8307ac6ff1cbf0d04c86835346297d8de0754248ddfd563aae4a75252
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
