services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0ac0fe7b34703ea394bead4f6f97b7530506474a47e131fece6816fb7ed9c95d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
