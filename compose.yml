services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9adbe053910629cd46c9c63562c4662b267319e6d01d603b907bcd26deebccb5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
