services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1fc67c6ea7dce8281196b9880537eb804c9716e9b6d3a2f7c209f39ba676e6d6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
