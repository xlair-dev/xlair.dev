services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:31a8f03804dad983496549c7751d0e8e1c10dc4219690e614edf87d31c8f840f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
