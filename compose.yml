services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7c16d565846dcca79b983cd5b7faeeda8fd47aa6938f92eb39537ff60fdddb76
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
