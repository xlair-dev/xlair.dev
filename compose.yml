services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9bad88ebb6667c8762a3977f2933461862d9cabfc96b76d52026d8d73f28c390
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
