services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2caf1b111e68ab568a89336ccecfdb2dddf57a42cafe98b229239ae91ddca634
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
