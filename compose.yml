services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3df1ff22162a11198d080e8f281524dc3d6b83815d174e56f909ef417e29c1f6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
