services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:944d373a4abb9f5a27979073656c9067e96520dfa4572d98b14496fd6034554a
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
