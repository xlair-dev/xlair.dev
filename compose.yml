services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9b283ff3c019b91e6e4024992f79cb470648dd780fa91a1a2d55e712213a3d4b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
