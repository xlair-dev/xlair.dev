services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:34b3ab76785ffdf8bae36200eaf88f6840efc97586819f00c6bbfb70c0a9266a
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
