services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:fdba19140d1eaa50562406043de88545f04b329c27fb45146c0739c732c5980f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
