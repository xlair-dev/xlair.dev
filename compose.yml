services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:263c021c2d8fe86766d910afdf60c12907da423678918abb172133421b063ae5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
