services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0c69fdf487cecf0af43819cdefe7a196a17afaae5c6bceb4a9a83b8870daff00
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
