services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c6e05dbd0e47a22cbda0f7caddfcb665c7d80e6e9236600e513e1668fda2bea5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
