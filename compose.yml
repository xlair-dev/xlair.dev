services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a4d14d2bf7ffacf07566f14c94e29ab086f1cc1e59fc3bbdaa500ad860725af9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
