services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4fa0ac2dadb1ff159372db42a092f33921c1b758c19bf86e68542d23b3287aba
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
