services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4c1db0b1cf25263819a8cf6ea80696b0f82affbb29bf740f40bbf42d10b8a8d6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
