services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c0e68498e0899a7af3a052ee057f78d9decb7bde699767097168187e5bfd0a34
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
