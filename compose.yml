services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0360b17da6674f98b367c87cb7c7187a5946b34bfd9eadfbc4bae8910bbaf772
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
