services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:296ef778a63aa984fe857cbf92e4ee78f62ec9b73c12a224844da1d20217a419
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
