services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e150e692e20c860fe61389dd90abed4f2b58835745d045dbbe0d49c6b9943802
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
