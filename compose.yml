services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:84bbe8bba8a1453326637e02d547f2525814dd7dd2155d7d7f66e44508f5be58
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
