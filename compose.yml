services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1cb5a9868be0f7f0f43a136dc9c9b039d1a243170e685c2ff042133a72dd8815
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
