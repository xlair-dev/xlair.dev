services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0632a7a8f7d0e95aa1beed78cfdd09942fa158d54aa8b85997ffcc585df5a3ec
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
