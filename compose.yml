services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:eee01d4c32a22f59d2c80cbfe92dc20ed690e3af06636f540610c8be165271f2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
