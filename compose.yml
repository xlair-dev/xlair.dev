services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f58dc7b46ff46041b460c8b02a83a114c13281f9969d57defd81e00ac6a01817
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
