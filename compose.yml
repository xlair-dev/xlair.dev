services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:54a6df193504f301f01970d355098d0d3089411196704d8837fe17329e3bb114
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
