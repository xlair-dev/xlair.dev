services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a38be4ad32440d14f358b14fca62b218969527f8bb2172b720d3852dd449e752
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
