services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a2840ee63d93fe0af81aab247c48b4eb80bb497986c70905e18a527f84a68e12
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
