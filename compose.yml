services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:6093e821615a5f591ae6c2e9b292fd3cb84977a86f635f2bc5c5e04c9038eefb
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
