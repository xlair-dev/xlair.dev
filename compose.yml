services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ba093c53e304664527f53b09009089498a08a6e4493a79811c3007f5aeceb175
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
