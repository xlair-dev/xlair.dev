services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:533943f4c5885f095d3298973d388654b61d22e47d2887b82bcc58bf1890a14f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
