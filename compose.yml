services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:17a0bb4bbd6629cb582a03595e42e247145cc5c14d762645caefe21824ba1e23
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
