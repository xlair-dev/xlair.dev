services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:e7827a79e17b97ad38dc96f6e558b6c7da7bf970c2859cd8e35fc688a8e5b600
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
