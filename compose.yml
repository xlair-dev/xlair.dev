services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4a675ca38fa5f189b55c51f2e01df584e31cb4b7e3b41bee6b76cdd26f220abc
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
