services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:921aa8884bb511820726addccad20e88e795e284a4439d0b9f75567a94227e4d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
