services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d4db9d6862167b1182ed1e00a83690add1f2784316e0856860cc19633dcd97a2
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
