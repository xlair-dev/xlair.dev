services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:afb705099051b08b0734658b5925199e61ec6e69b11a7edd40c83deaa0faf970
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
