services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f3a44a9a4b783a2af069ee0aeec90609580a09a87419566be48c110c961ea14e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
