services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5d63b2a9cc0cdbd733cc6d69b675e06702de06818b09181038696127f76baba5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
