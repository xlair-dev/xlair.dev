services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7ee03b062820dc21a77ac84b86c8c22d40d3f1fe622694d15b7706c030610a18
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
