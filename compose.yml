services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8b21150c24246d013f6b57b064c56cfcb70c8144a087bce0b35a25a2f6f34386
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
