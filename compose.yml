services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ce823401d78e99eae8e90f68855aeb4f00dd5e7042cd3d5f5f35a782cd280694
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
