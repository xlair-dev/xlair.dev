services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2c061d1cdf84c72c7c8857e06ef5c549e8123d235a7cdb8f5c5f34c287694b1f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
