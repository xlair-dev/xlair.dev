services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1820495502bb8cff662b6627ada2728279110ee1e38d1a3784062680d09a2e52
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
