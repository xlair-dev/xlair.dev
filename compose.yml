services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5f11a9bfb764e5dadd64f358c8e4ac06a95fcce78037aadad4666ba1447c41e7
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
