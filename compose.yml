services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ba52cec84d7a35f658a861ca0ba7e225e9647d9476b7c860c8b8662fafc144f5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
