services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:edc566b949aa8a70ff7e50aae701da80b6b1785e08e10cd9fc3bdf3978aea7f9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
