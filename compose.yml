services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:7e9474de741925773934b68ca6d39ea3633d1e2c4630d34f4351b45a7278e894
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
