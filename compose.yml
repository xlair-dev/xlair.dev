services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:48f8283f1a55648860b335d2f7e1ad275fd4021e2b2711549b8025555eba1209
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
