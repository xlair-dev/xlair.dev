services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ff299db3d00bc50bd375aa67665cacccf00eb8af85229d15518c7562fb6b832d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
