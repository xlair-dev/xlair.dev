services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:8021e43ae6fecf1304a35eb5fc956a2bb7a71657d8c2e21163863f2db798235b
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
