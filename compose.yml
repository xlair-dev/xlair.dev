services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:992f26167816ba6d34ec32085d858567f999c4c388096f5bfef9eacdc60974cf
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
