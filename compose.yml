services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c9b009ec3025a7999b94c5a188f474230fadd15a98ed04442d38a6daa501730c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
