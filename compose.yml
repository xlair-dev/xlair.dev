services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:3c85d8180bc7128b69e3dfc037dbf39375252d957f445eb1a7456d02f4cb1cd3
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
