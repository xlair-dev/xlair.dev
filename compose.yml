services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f0e23e0fc88d2c27c365f87bde9372c4c497154b781afa5174d8620542541eef
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
