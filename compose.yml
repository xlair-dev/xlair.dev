services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:103ef462c9472021dbb0375ca7a88dfeccb666799ed56c7a6995cf1fa447e2dc
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
