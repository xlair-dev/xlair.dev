services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:6aaafc8d09fc90c2975d956ce50d0bc079dd31adc27e7a451505fc1a4e25c3b6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
