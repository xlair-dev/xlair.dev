services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ca28a5fca7fa21ef1bca65f154d0d10df615fd5dfcf8e70cb32fb67974378eb4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
