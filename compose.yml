services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:6f9ccf8b8b2ad74b61d59c48d3456238b8980893130b765bb9ba9521e0274824
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
