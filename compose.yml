services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:73f7c749aec005f9ecd4172ca464dca0debd6531c3bf97920696e58863a44fed
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
