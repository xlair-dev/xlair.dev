services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:bc52bf29b1ecfd6b2038c617132e420a25780caa03d7fb1373ebf7c5b2e8f628
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
