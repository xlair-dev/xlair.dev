services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9008a5579b3c865f11fd667cbc28aec41791d92bbaaaf38a76dbcbc6f44914c0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
