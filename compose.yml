services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1ca64060858891c817e4d01d42b655408d534f0fd61878a0d23a35ad876a72b4
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
