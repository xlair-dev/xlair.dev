services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:1d0eeba55a17b2206744eb1069750d6e4ba4dadc1cd333c3153746626baef6ef
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
