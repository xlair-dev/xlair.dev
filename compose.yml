services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2489be898d4ec6a744d62c03a0f22a81e19e9ac6fce3fd5db63b50bd636e07dd
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
