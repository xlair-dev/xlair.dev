services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:62d9e1f2e1deed7a1855c98ff9fd542dd4758729fbe0048bb97c5d629974a54c
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
