services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:94da42563e46c90b942c75539bae535a042d264005f8355c471ee7b00ab08ecf
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
