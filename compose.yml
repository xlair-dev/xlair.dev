services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:6432c10eb12a216de3620b269848b8c7526662acd68b1772a2cd119f8133e3a9
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
