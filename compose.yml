services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:fc8a5719d391af4ffa2615b2c15a9ca63e7c98659034a81502a2ffecbec5c1de
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
