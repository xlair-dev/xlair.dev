services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d08a787d9b6e38c9039a988c6bf4ceb9a4e33fcb40ca6651012504984e135b1d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
