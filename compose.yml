services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2fd6feaacd07ee04b309fe6d7c4ae5728f734f7a561107155c52dc54cf94f338
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
