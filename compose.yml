services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:c0f8d73428ec8812380da4cd8901956b0786d76d12a7ee35feb3dbd532c2337e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
