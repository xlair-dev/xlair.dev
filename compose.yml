services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:d261b9137b75e6f06164efc56d94b4fdbfaea7d9258a13688c990407f90c2fe6
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
