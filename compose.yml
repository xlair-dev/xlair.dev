services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ec44fbabc1f6fd4639ac910aefb14b4802f4175bdfcb90194da5953da6e6745d
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
