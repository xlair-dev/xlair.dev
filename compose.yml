services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:2b51b3e25788de51dd5ba57e228c6894720e8fc1fe07ef623c45e90c5ad40b6f
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
