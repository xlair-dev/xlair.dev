services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:4bc7eaef77c7a7c4763bb25e764372786e8ae61b56afb87cdec475e2b565ce22
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
