services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:a0d6860e9e7a29b61c3e82df0478c0541bdd98e6016391833fd54da049708791
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
