services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:32c0cdb11d57892a8fb9c8dafe1d8163fd7009e89fa37791f315fdd73716f6eb
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
