services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:6829444a9d2f3440d35341fd0d62d794ffcc2559aadb6ae547877c4e9889c614
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
