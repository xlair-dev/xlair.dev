services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:5b5e1001dedf395aef2a4923237c31f6eb07c107b77a53335813bc617117b144
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
