services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:112a561147507da102dd2fb58120802298fabb067de4bee91cac19013802c0e8
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
