services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:0c50bd816a7c24f0b7926024528c27271de6e384ba0b63c3d8dca8e35ffbac0e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
