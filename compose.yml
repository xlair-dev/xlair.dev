services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:f0feca26909e924178bb96cecf2b33f2565c7a571991df10f0b4305fc4e48701
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
