services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:14258e50d25e4ef645c40bf4b86968eaaf0b3f613627a8d0ea4089d57d9a302e
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
