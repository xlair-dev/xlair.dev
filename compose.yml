services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:05f5a705ebcad05bff6aca1c1bc5a8b047359ef17a071e011caf8f2078c61d69
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
