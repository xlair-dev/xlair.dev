services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:765938574c79c96701407c880ec1460e4add3600c6e4adbccdb625f844a122a3
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
