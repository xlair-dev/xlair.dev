services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:ac6524a96df94008e94cca9ba2ec14da1037e94f3ecb874e005b96c9a34a6ddc
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
