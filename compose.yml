services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:26419743941c19e0a1eca850fc411e5313e77d0dd0dfb6baa9fa41b5afcc92d5
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
