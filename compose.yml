services:
  app:
    image: ghcr.io/xlair-dev/xlair.dev:latest@sha256:9961b470d43cec71b2d742b1f1c891aad9454d9824e0c6f908ac7e022f653bc0
    container_name: xlair-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
